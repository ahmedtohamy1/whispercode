name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (e.g. v1.2.0). Leave blank to only upload as artifact."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.0.12077973
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/android/src-tauri

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run --cwd packages/android build

      - name: Setup Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > packages/android/release.keystore
          printf 'storeFile=../../../../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > packages/android/src-tauri/gen/android/keystore.properties

      - name: Build Android APK (arm64)
        working-directory: packages/android
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          bun run tauri android build --apk --target aarch64

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: whispercode-arm64-release
          path: packages/android/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: packages/android/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          name: WhisperCode ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
